name: Download supplements

on:
  workflow_dispatch:
  schedule:
    # Resume every 6 h (a job can run at most 6 h). Disable the workflow when done.
    - cron: "17 */6 * * *"

# Only one job at a time may write to the repo (paths.rds / data/ / cache files)
concurrency:
  group: dmsr-repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # picked up by gert::git_push() via the {credentials} package
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TIME_BUDGET_MIN: "315"   # scripts stop cleanly and commit before the 330 min step timeout
    steps:
      - uses: actions/checkout@v5

      - name: Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tibble
            any::httr2
            any::jsonlite
            any::gert

      - name: Run R/04-main_download.r
        timeout-minutes: 330   # leave room for the final commit below
        run: Rscript R/04-main_download.r

      # Runs even if the script crashed or hit the timeout, so progress made since
      # the last in-script checkpoint is not lost.
      - name: Commit and push leftovers
        if: always()
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "download: save progress"
            git pull --rebase
            git push
          fi
