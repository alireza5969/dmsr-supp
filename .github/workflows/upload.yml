name: Upload to Telegram

on:
  workflow_dispatch:
  # Run after every downloader run, whatever its outcome (it may simply have timed out)
  workflow_run:
    workflows: ["Download supplements"]
    types: [completed]

concurrency:
  group: dmsr-repo-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TG_TOKEN:   ${{ secrets.TG_TOKEN }}
      CHAT_ID:    ${{ secrets.CHAT_ID }}
      TIME_BUDGET_MIN: "315"
    steps:
      - uses: actions/checkout@v5

      - name: Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tibble
            any::fs
            any::httr2
            any::curl

      - name: Run R/05-main_upload_telegram.r
        timeout-minutes: 330
        run: Rscript R/05-main_upload_telegram.r

      # Runs even if the script crashed or hit the timeout. It ALWAYS pushes: the R script may
      # have committed locally while its own pushes failed.
      - name: Commit and push upload cache
        if: always()
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "upload: save cache"
          fi
          git pull --rebase
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $attempt)"; sleep 20
            git pull --rebase
          done
          exit 1
